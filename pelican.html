<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, #dff3ff, #f7fbff 45%, #e9f7ee);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #12313f;
  }
  .card { text-align: center; padding: 28px; }
  h1 { font-size: 22px; letter-spacing: 2px; margin: 0 0 6px; font-weight: 600; }
  .hint { margin: 0 0 22px; color: #5b7a8a; font-size: 13px; }
  #rideBtn {
    font: 600 16px/1 "Segoe UI", "PingFang SC", system-ui, sans-serif;
    padding: 16px 34px;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    color: #10282f;
    background: linear-gradient(180deg, #ffd873, #f5b23c);
    box-shadow: 0 8px 20px rgba(200, 140, 30, .35), inset 0 -3px 0 rgba(0, 0, 0, .12);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #rideBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(200, 140, 30, .42), inset 0 -3px 0 rgba(0, 0, 0, .12);
  }
  #rideBtn:active { transform: translateY(1px); }
  #rideBtn:focus-visible,
  .close:focus-visible { outline: 3px solid #2b7f9e; outline-offset: 3px; }
  .modal {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(10, 28, 38, .55);
    backdrop-filter: blur(4px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .22s ease, visibility .22s ease;
  }
  .modal.show { opacity: 1; visibility: visible; }
  .panel {
    width: min(720px, 100%);
    background: linear-gradient(180deg, #ffffff, #eef8fd);
    border: 1px solid #cfe6f0;
    border-radius: 18px;
    box-shadow: 0 30px 70px rgba(6, 30, 44, .35);
    padding: 18px 18px 12px;
    transform: translateY(18px) scale(.96);
    transition: transform .28s cubic-bezier(.2, .9, .25, 1.15);
  }
  .modal.show .panel { transform: none; }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .panel-head h2 { margin: 0; font-size: 16px; letter-spacing: 1px; color: #17394a; }
  .close {
    border: 0;
    background: #e6f2f8;
    color: #35596b;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    display: grid;
    place-items: center;
    transition: background .15s ease, color .15s ease;
  }
  .close:hover { background: #cfe6f2; color: #17394a; }
  svg { display: block; width: 100%; height: auto; border-radius: 12px; background: #eaf8ff; }
  .bike { animation: road-bob .9s ease-in-out infinite; }
  @keyframes road-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2.5px); }
  }
  .wheel {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .crank, .spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.1s linear infinite;
  }
  .leg-front {
    transform-box: fill-box;
    transform-origin: 50% 0;
    animation: pedal-a 1.1s linear infinite;
  }
  .leg-back {
    transform-box: fill-box;
    transform-origin: 50% 0;
    animation: pedal-b 1.1s linear infinite;
  }
  @keyframes pedal-a {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(14deg); }
    50% { transform: rotate(0deg); }
    75% { transform: rotate(-14deg); }
  }
  @keyframes pedal-b {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-14deg); }
    50% { transform: rotate(0deg); }
    75% { transform: rotate(14deg); }
  }
  .scarf {
    transform-box: fill-box;
    transform-origin: 0% 50%;
    animation: flap .55s ease-in-out infinite alternate;
  }
  @keyframes flap {
    from { transform: rotate(-6deg) scaleY(.95); }
    to { transform: rotate(9deg) scaleY(1.08); }
  }
  .head {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: nod 1.1s ease-in-out infinite;
  }
  @keyframes nod {
    0%, 100% { transform: rotate(-1.5deg); }
    50% { transform: rotate(1.5deg); }
  }
  .pouch {
    transform-box: fill-box;
    transform-origin: 50% 10%;
    animation: jiggle 1.1s ease-in-out infinite;
  }
  @keyframes jiggle {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.06); }
  }
  .ground line { animation: dash .6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -44; } }
  @media (prefers-reduced-motion: reduce) {
    .bike, .wheel, .crank, .leg-front, .leg-back,
    .scarf, .head, .pouch, .ground line { animation: none !important; }
    .modal, .panel { transition: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>鹈鹕骑自行车</h1>
    <p class="hint">点击下面的按钮，弹出鹈鹕骑自行车的动画</p>
    <button id="rideBtn" type="button">🚲 让鹈鹕出发</button>
  </main>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="panel">
      <div class="panel-head">
        <h2 id="modalTitle">🐦 鹈鹕骑行中</h2>
        <button class="close" id="closeBtn" type="button" aria-label="关闭">✕</button>
      </div>
      <svg id="scene" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="640" height="420" fill="#eaf8ff"/>
        <circle cx="110" cy="80" r="38" fill="#fff7cc" opacity=".9"/>
        <g opacity=".7">
          <ellipse cx="470" cy="78" rx="42" ry="18" fill="#ffffff"/>
          <ellipse cx="505" cy="70" rx="30" ry="22" fill="#ffffff"/>
          <ellipse cx="540" cy="80" rx="34" ry="16" fill="#ffffff"/>
        </g>
        <rect y="330" width="640" height="90" fill="#cfe8b8"/>
        <rect y="340" width="640" height="26" fill="#c3d9c0"/>
<g class="ground" stroke="#89969a" stroke-width="4" stroke-linecap="round">
          <line x1="80" y1="394" x2="170" y2="394"/>
          <line x1="270" y1="394" x2="360" y2="394"/>
          <line x1="470" y1="394" x2="560" y2="394"/>
        </g>
        <line x1="0" y1="378" x2="640" y2="378" stroke="#89969a" stroke-width="4" stroke-dasharray="26 18"/>
        <g class="bike">
          <ellipse cx="320" cy="368" rx="150" ry="9" fill="#1b3440" opacity=".16"/>
          <g stroke="#24343c" stroke-width="9" fill="none" stroke-linecap="round">
            <circle class="spin" cx="222" cy="302" r="54"/>
            <circle class="spin" cx="420" cy="302" r="54"/>
          </g>
          <g class="wheel" stroke="#9aa9b3" stroke-width="2" fill="none">
            <circle cx="222" cy="302" r="45"/>
            <path d="M222 257 v90 M177 302 h90 M190 270 l64 64 M254 270 l-64 64"/>
          </g>
          <g class="wheel" stroke="#9aa9b3" stroke-width="2" fill="none">
            <circle cx="420" cy="302" r="45"/>
            <path d="M420 257 v90 M375 302 h90 M388 270 l64 64 M452 270 l-64 64"/>
          </g>
          <circle cx="222" cy="302" r="6" fill="#4b606b"/>
          <circle cx="420" cy="302" r="6" fill="#4b606b"/>
          <g stroke="#2f8fab" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M222 302 L308 300 L318 236"/>
            <path d="M308 300 L418 264 L420 238"/>
            <path d="M418 264 L420 202"/>
            <path d="M420 228 L422 370"/>
            <path d="M420 202 L452 196"/>
          </g>
          <path d="M452 196 l0 30 h-14" stroke="#24343c" stroke-width="5" fill="none" stroke-linecap="round"/>
          <rect x="292" y="244" width="28" height="9" rx="4" fill="#24343c"/>
          <rect x="407" y="206" width="10" height="16" rx="4" fill="#24343c"/>
          <path d="M418 220 C 432 214, 446 200, 448 186" stroke="#24343c" stroke-width="6" fill="none" stroke-linecap="round"/>
          <g class="crank">
            <circle cx="382" cy="318" r="20" fill="none" stroke="#566a75" stroke-width="4"/>
            <path d="M382 318 L362 312" stroke="#566a75" stroke-width="6" stroke-linecap="round"/>
            <path d="M382 318 L402 324" stroke="#566a75" stroke-width="6" stroke-linecap="round"/>
            <rect x="352" y="306" width="24" height="8" rx="4" fill="#24343c"/>
            <rect x="400" y="318" width="24" height="8" rx="4" fill="#24343c"/>
          </g>
          <g class="pelican">
            <circle cx="336" cy="190" r="5" fill="#7c8794"/>
            <path d="M358 158 C 330 146, 302 148, 288 164 Q 304 176, 320 180 Q 300 194, 278 186 Q 296 202, 330 192 Q 348 188, 358 158 Z" fill="#545e69"/>
            <g class="leg-back">
              <path d="M326 210 q-14 34 -64 44" stroke="#e07a1f" stroke-width="5" fill="none" stroke-linecap="round"/>
              <path d="M262 254 l-38 -6 l-22 10" stroke="#e07a1f" stroke-width="5" fill="none" stroke-linecap="round"/>
              <path d="M202 258 l-10 4" stroke="#cf6a12" stroke-width="5" fill="none" stroke-linecap="round"/>
            </g>
            <g class="leg-front">
              <path d="M348 210 q-28 26 -54 30" stroke="#f6a04a" stroke-width="6" fill="none" stroke-linecap="round"/>
              <path d="M294 240 l-52 -2 l-20 14" stroke="#f6a04a" stroke-width="6" fill="none" stroke-linecap="round"/>
              <path d="M222 252 l-10 3" stroke="#e07a1f" stroke-width="6" fill="none" stroke-linecap="round"/>
            </g>
            <path d="M372 172 q-18 42 4 70 l28 4 q-24 -34 -12 -74 z" fill="#6f7a86"/>
            <ellipse cx="338" cy="172" rx="78" ry="48" transform="rotate(-12 338 172)" fill="#6f7a86"/>
            <ellipse cx="340" cy="186" rx="58" ry="30" transform="rotate(-12 340 186)" fill="#59636e" opacity=".55"/>
            <g class="head">
              <circle cx="402" cy="112" r="26" fill="#8c97a3"/>
              <circle cx="408" cy="106" r="9" fill="#ffffff" opacity=".28"/>
              <path d="M418 112 L504 112 Q506 138 470 146 Q446 150 420 146 Z" fill="#f3b93c"/>
              <path class="pouch" d="M420 146 Q418 188 462 182 Q450 156 436 146 Z" fill="#f0a12c"/>
              <path d="M424 120 L500 118" stroke="#d99a1f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
              <circle cx="414" cy="104" r="6" fill="#ffffff"/>
              <circle cx="416" cy="104" r="3" fill="#1b2530"/>
              <path class="scarf" d="M400 88 q-14 4 -22 -22 q-2 34 18 40 z" fill="#f2d45c"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </div>
  <script>
    (() => {
      const modal = document.getElementById('modal');
      const openBtn = document.getElementById('rideBtn');
      const closeBtn = document.getElementById('closeBtn');
      function open() {
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
        closeBtn.focus();
      }
      function close() {
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden', 'true');
        openBtn.focus();
      }
      openBtn.addEventListener('click', open);
      closeBtn.addEventListener('click', close);
      modal.addEventListener('click', e => {
        if (e.target === modal) close();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && modal.classList.contains('show')) close();
      });
    })();
  </script>
</body>
</html>
