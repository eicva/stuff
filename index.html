<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>符文前线 · 塔防</title>
<style>
:root{color-scheme:dark;--gold:#e5b967;--muted:#9ba7b9;--line:#303848}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:radial-gradient(ellipse at 48% -15%,#293447,#121722 48%,#0d1016);color:#e8edf5;font:14px/1.45 system-ui,sans-serif}.wrap{height:100%;max-width:1440px;margin:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px}.top{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px}.sigil{width:38px;height:38px;border:1px solid #947747;border-radius:11px;display:grid;place-items:center;color:var(--gold);font-size:19px;background:#28231b}.brand h1{font-size:18px;margin:0;letter-spacing:2px}.brand p{margin:1px 0 0;color:var(--muted);font-size:11px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#191e28;border:1px solid var(--line);border-radius:9px;padding:7px 12px;color:var(--muted);font-size:12px;white-space:nowrap}.stat b{color:#fff;margin-left:5px;font-size:14px}.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.board{position:relative;display:flex;flex-direction:column;min-height:0;background:#111720;border:1px solid #343d4c;border-radius:12px;overflow:hidden}.canvasbox{flex:1;min-height:0;display:grid;place-items:center}canvas{display:block;cursor:crosshair}.boardfoot{flex:none;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#171c25;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 10px;vertical-align:-1px}.legend i:first-child{margin-left:0}.side{min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto;scrollbar-width:thin}.card{flex:none;background:linear-gradient(145deg,#1b202b,#161b24);border:1px solid var(--line);border-radius:10px;padding:11px 12px}.card h2{font-size:12px;letter-spacing:1px;color:var(--gold);margin:0 0 8px}.card p{color:var(--muted);font-size:11px;margin:0}.skills{display:grid;grid-template-columns:1fr 1fr;gap:6px}.skill,.support,.primary,.secondary{background:#202735;border:1px solid #384456;color:#dce5f1;border-radius:8px;padding:8px 9px;text-align:left;cursor:pointer;font-family:inherit}.skill.active{border-color:var(--gold);background:#352c1e}.skill strong{font-size:12px}.skill small{display:block;color:#9daabd;font-size:10px;margin-top:2px}.support{font-size:11px;padding:6px 8px;text-align:center}#supports{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.support.on{border-color:#69c6c7;background:#183338}.socketrow{display:flex;gap:6px;margin-bottom:7px}.socket{width:26px;height:26px;border:1px dashed #778294;border-radius:50%;display:grid;place-items:center;color:#717d8f;font-size:12px}.socket.filled{border-style:solid;border-color:#73d8df;color:#73d8df}.primary,.secondary{font-weight:700;text-align:center;background:linear-gradient(#f0cc7f,#c99642);color:#191610;border:0;padding:9px 14px;font-size:13px}.secondary{background:#263142;color:#e3eaf4;border:1px solid #3a485a}.primary:disabled{opacity:.42;cursor:not-allowed}#selectedInfo{margin-top:0}#applyBtn{width:100%;margin-top:8px}.divider{flex:none;height:1px;background:var(--line);margin:10px 0 0}.controls{display:flex;gap:8px;margin-top:10px}.controls .primary{flex:1}.notice{min-height:16px;color:#aab7ca;font-size:11px;margin-top:6px}#loadout{margin-top:0}.wavebar{height:5px;border-radius:8px;background:#303846;overflow:hidden;margin-top:8px}.wavebar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#61d1d1,#e8ba67)}.card p.hint{font-size:11px;line-height:1.75;margin:0}.hintcard{margin-top:auto}.toast{position:absolute;top:14px;left:50%;transform:translate(-50%,-10px);background:#1b2633;border:1px solid #607282;border-radius:8px;padding:8px 13px;opacity:0;pointer-events:none;transition:.2s;z-index:2}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){body{overflow:auto}.wrap{height:auto;min-height:100%}.layout{grid-template-columns:1fr}.side{overflow:visible;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.hintcard{margin-top:0}.canvasbox{min-height:340px}.top{align-items:flex-start;flex-direction:column}.wrap{padding:12px}}@media(max-height:720px){.wrap{padding:10px 14px;gap:8px}.sigil{width:32px;height:32px;font-size:16px;border-radius:9px}.brand h1{font-size:16px}.card{padding:9px 10px}.skill{padding:6px 8px}.skill strong{font-size:11px}.primary,.secondary{padding:7px 12px;font-size:12px}}
</style></head><body><div class="wrap">
<header class="top"><div class="brand"><div class="sigil">✦</div><div><h1>符文前线</h1><p>镶嵌技能 · 链接辅助 · 守住最后的灯塔</p></div></div><div class="stats"><div class="stat">✧ 奥术碎片 <b id="gold">120</b></div><div class="stat">❤ 灯塔生命 <b id="life">20</b></div><div class="stat">⚔ 波次 <b id="wave">0</b></div><div class="stat">☠ 击杀 <b id="kills">0</b></div></div></header>
<main class="layout"><section class="board"><div class="toast" id="toast"></div><div class="canvasbox"><canvas id="game" width="960" height="528" aria-label="塔防游戏地图"></canvas></div><div class="boardfoot"><span>点击空地部署 · 点击塔选择并编辑 · 右键拆除</span><span class="legend"><i style="background:#806041"></i>敌人路线<i style="background:#6dc9ff"></i>防御塔<i style="background:#d7825b"></i>怪物</span></div></section><aside class="side">
<section class="card"><h2>主动技能石</h2><div class="skills" id="skills"></div></section>
<section class="card"><h2>辅助技能石 · 链接</h2><div class="socketrow" id="sockets"></div><div class="socketrow" id="supports"></div><div class="notice" id="loadout"></div></section>
<section class="card"><h2>作战台</h2><div class="notice" id="selectedInfo">点击地图上的防御塔进行选择。</div><button class="primary" id="applyBtn" disabled>替换为所选技能石</button><div class="divider"></div><div class="controls"><button class="primary" id="waveBtn">▶ 开始第 1 波</button><button class="secondary" id="speedBtn">⏩ 1×</button></div><div class="wavebar"><i id="progress"></i></div><div class="notice" id="waveInfo">布置防御后，点击开始迎击敌人。</div></section>
<section class="card hintcard"><p class="hint">① 选择技能后点击空地部署 ② 点击已部署塔选中，可替换技能石 ③ 辅助石最多链接 2 颗，多重投射发射双弹 ④ 空格开始下一波，右键拆塔返还碎片。</p></section></aside></main></div>
<script>
'use strict';(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=960,H=528,C=48;
const canvasbox=document.querySelector('.canvasbox');function fitCanvas(){const r=canvasbox.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);canvas.style.width=W*s+'px';canvas.style.height=H*s+'px'}
new ResizeObserver(fitCanvas).observe(canvasbox);fitCanvas();
const skills={bolt:{name:'奥术飞弹',icon:'✦',cost:45,range:155,rate:.9,damage:18,color:'#6dc9ff',kind:'projectile',desc:'追踪单体'},fire:{name:'烈焰爆弹',icon:'🔥',cost:55,range:145,rate:1.35,damage:30,color:'#ff8a4c',kind:'splash',desc:'爆炸范围'},frost:{name:'寒霜脉冲',icon:'❄',cost:50,range:135,rate:1.1,damage:13,color:'#8ce8e7',kind:'slow',desc:'冰霜减速'},chain:{name:'闪电链',icon:'ϟ',cost:65,range:165,rate:1.55,damage:24,color:'#c99cff',kind:'chain',desc:'真实电弧·跳跃打击'},blade:{name:'刃灵召唤',icon:'⚔',cost:60,range:118,rate:2.5,damage:16,color:'#f2d879',kind:'summon',desc:'召唤刃灵追击敌人'}};
const supports={multi:{name:'多重投射',icon:'⋔',desc:'投射物数量 +1'},haste:{name:'急速施法',icon:'»',desc:'攻击速度提高 35%'},might:{name:'强力打击',icon:'✹',desc:'伤害提高 45%'},reach:{name:'远距增幅',icon:'◎',desc:'范围提高 25%'},burn:{name:'余烬附着',icon:'♨',desc:'命中后附加灼烧'}};
const route=[[-24,264],[120,264],[120,120],[360,120],[360,408],[600,408],[600,216],[840,216],[840,312],[984,312]];
let gold=120,life=20,wave=0,kills=0,selected='bolt',links=[],towers=[],enemies=[],projectiles=[],particles=[],arcs=[],spawnLeft=0,spawnTimer=0,active=false,speed=1,last=0,gameOver=false,selectedTower=null;
function notify(text){const e=document.getElementById('toast');e.textContent=text;e.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>e.classList.remove('show'),1900)}
function refreshLinks(){document.querySelectorAll('.support').forEach((b,i)=>b.classList.toggle('on',links.includes(Object.keys(supports)[i])));document.getElementById('sockets').innerHTML='<span class="socket filled">✦</span>'+[0,1].map((_,i)=>`<span class="socket ${links[i]?'filled':''}">${links[i]?supports[links[i]].icon:'+'}</span>`).join('');document.getElementById('loadout').textContent=links.length?'当前链接：'+links.map(id=>supports[id].name).join(' + '):'未连接辅助石'}
function updateSelection(){const info=document.getElementById('selectedInfo'),button=document.getElementById('applyBtn');if(!selectedTower){info.textContent='点击地图上的防御塔进行选择。';button.disabled=true;return}const s=skills[selectedTower.type];info.textContent=`${s.icon} ${s.name} · 辅助：${selectedTower.links.map(id=>supports[id].name).join('、')||'无'} · 替换费用 ${skills[selected].cost} 碎片`;button.disabled=false}
Object.entries(skills).forEach(([id,s])=>{const b=document.createElement('button');b.className='skill'+(id===selected?' active':'');b.innerHTML=`<strong>${s.icon} ${s.name}</strong><small>${s.cost} 碎片 · ${s.desc}</small>`;b.onclick=()=>{selected=id;document.querySelectorAll('.skill').forEach(x=>x.classList.remove('active'));b.classList.add('active');updateSelection();notify('已选择 '+s.name)};document.getElementById('skills').appendChild(b)});
Object.entries(supports).forEach(([id,s])=>{const b=document.createElement('button');b.className='support';b.title=s.desc;b.textContent=s.icon+' '+s.name;b.onclick=()=>{if(links.includes(id))links=links.filter(x=>x!==id);else if(links.length<2)links.push(id);else return notify('链接槽最多 2 颗辅助石');refreshLinks();updateSelection()};document.getElementById('supports').appendChild(b)});refreshLinks();
function updateUI(){document.getElementById('gold').textContent=gold;document.getElementById('life').textContent=life;document.getElementById('wave').textContent=wave;document.getElementById('kills').textContent=kills;document.getElementById('waveInfo').textContent=active?`敌群来袭：剩余 ${spawnLeft} 个待出发，场上 ${enemies.filter(e=>!e.dead).length} 个`:'布置防御后，点击开始迎击敌人。'}
function onRoute(x,y){for(let i=0;i<route.length-1;i++){const [ax,ay]=route[i],[bx,by]=route[i+1],dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy)));if(Math.hypot(x-ax-t*dx,y-ay-t*dy)<26)return true}return false}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('click',e=>{if(gameOver)return;const p=pos(e),tower=towers.find(t=>Math.hypot(t.x-p.x,t.y-p.y)<23);if(tower){selectedTower=tower;updateSelection();return}selectedTower=null;updateSelection();const x=Math.floor(p.x/C)*C+C/2,y=Math.floor(p.y/C)*C+C/2;if(x<24||x>W-24||y<24||y>H-24)return;if(onRoute(x,y))return notify('不能在敌人路线上建塔');if(towers.some(t=>Math.hypot(t.x-x,t.y-y)<C*.8))return;const s=skills[selected];if(gold<s.cost)return notify('碎片不足');gold-=s.cost;towers.push({x,y,type:selected,links:[...links],cool:Math.random()*.25,flash:0,minions:[]});updateUI()});
canvas.addEventListener('contextmenu',e=>{e.preventDefault();const p=pos(e),i=towers.findIndex(t=>Math.hypot(t.x-p.x,t.y-p.y)<25);if(i>=0){if(towers[i]===selectedTower)selectedTower=null;gold+=Math.floor(skills[towers[i].type].cost*.45);towers.splice(i,1);updateSelection();updateUI();notify('已拆除防御塔，返还部分碎片')}});
document.getElementById('applyBtn').onclick=()=>{if(!selectedTower)return;const fee=skills[selected].cost;if(gold<fee)return notify('碎片不足，替换需要 '+fee+' 碎片');gold-=fee;selectedTower.type=selected;selectedTower.links=[...links];selectedTower.cool=0;selectedTower.minions=[];updateSelection();updateUI();notify(`已替换为${skills[selected].name}`)};
function spawn(){const hp=50+wave*17;enemies.push({x:route[0][0],y:route[0][1],segment:0,progress:0,hp,maxHp:hp,speed:45+Math.min(wave*1.4,22),slow:0,burn:0,dead:false});spawnLeft--;spawnTimer=.72}
function defeat(e){if(e.dead)return;e.dead=true;kills++;gold+=8+Math.floor(wave*.8);for(let i=0;i<7;i++)particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*95,vy:(Math.random()-.5)*95,life:.45,color:'#ffad72'})}
function makeArc(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,length=Math.hypot(dx,dy),nx=-dy/(length||1),ny=dx/(length||1),points=[{x:x1,y:y1}];for(let i=1;i<8;i++){const f=i/8,jitter=(Math.random()-.5)*Math.min(34,length*.16);points.push({x:x1+dx*f+nx*jitter,y:y1+dy*f+ny*jitter})}points.push({x:x2,y:y2});const branches=[];if(Math.random()<.65){const index=2+Math.floor(Math.random()*4),p=points[index],f=.12+Math.random()*.11;branches.push([{x:p.x,y:p.y},{x:p.x+dx*f+nx*(Math.random()-.5)*24,y:p.y+dy*f+ny*(Math.random()-.5)*24}])}return{points,branches,life:.19,maxLife:.19}}
function fire(t,target){const s=skills[t.type],mods=t.links,damage=s.damage*(mods.includes('might')?1.45:1);t.cool=s.rate*(mods.includes('haste')?.65:1);t.flash=.17;if(s.kind==='summon'){if(t.minions.length<3)t.minions.push({x:t.x,y:t.y,target,cool:0});return}if(s.kind==='chain'){let hitList=[target],lastHit=target;for(let i=0;i<3;i++){const next=enemies.filter(e=>!e.dead&&!hitList.includes(e)&&Math.hypot(e.x-lastHit.x,e.y-lastHit.y)<92).sort((a,b)=>Math.hypot(a.x-lastHit.x,a.y-lastHit.y)-Math.hypot(b.x-lastHit.x,b.y-lastHit.y))[0];if(!next)break;hitList.push(next);lastHit=next}let from={x:t.x,y:t.y};for(const e of hitList){e.hp-=damage;arcs.push(makeArc(from.x,from.y,e.x,e.y));from=e;if(e.hp<=0)defeat(e)}return}
// Fire two clearly separated projectiles when Multi-projectile is linked.
const count=mods.includes('multi')?2:1,range=s.range*(mods.includes('reach')?1.25:1),nearby=enemies.filter(e=>!e.dead&&Math.hypot(e.x-t.x,e.y-t.y)<range).sort((a,b)=>(b.segment+b.progress)-(a.segment+a.progress)),dx=target.x-t.x,dy=target.y-t.y,len=Math.hypot(dx,dy)||1,perp={x:-dy/len,y:dx/len};for(let i=0;i<count;i++){const aim=i===1&&nearby.find(e=>e!==target)||target,side=count===1?0:(i===0?-1:1)*9;projectiles.push({x:t.x+perp.x*side,y:t.y+perp.y*side,target:aim,damage,color:s.color,kind:s.kind,slow:s.kind==='slow'?1.5:0,burn:mods.includes('burn')?2.5:0,splash:s.kind==='splash'?43:0,speed:330,lane:side})}}
function waveTotal(){return 7+wave*3}
function update(dt){if(gameOver)return;dt=Math.min(dt,.05)*speed;if(active){spawnTimer-=dt;if(spawnLeft>0&&spawnTimer<=0)spawn();if(spawnLeft===0&&enemies.every(e=>e.dead)){active=false;gold+=20+wave*3;notify(`第 ${wave} 波完成！奖励 ${20+wave*3} 碎片`);updateUI()}}
for(const e of enemies){if(e.dead)continue;if(e.slow>0)e.slow-=dt;if(e.burn>0){e.burn-=dt;e.hp-=dt*7;if(e.hp<=0){defeat(e);continue}}const [ax,ay]=route[e.segment],[bx,by]=route[e.segment+1],len=Math.hypot(bx-ax,by-ay);e.progress+=e.speed*(e.slow>0?.52:1)*dt/len;e.x=ax+(bx-ax)*e.progress;e.y=ay+(by-ay)*e.progress;if(e.progress>=1){e.segment++;e.progress=0;if(e.segment>=route.length-1){e.dead=true;life--;if(life<=0){gameOver=true;notify('灯塔已陷落！点击重新开始');document.getElementById('waveBtn').textContent='↻ 重新开始'}}}}
for(const t of towers){const s=skills[t.type],range=s.range*(t.links.includes('reach')?1.25:1);t.cool-=dt;t.flash=Math.max(0,t.flash-dt);if(s.kind==='summon'){t.minions=t.minions.filter(m=>!m.dead);for(const m of t.minions){m.cool-=dt;if(!m.target||m.target.dead)m.target=enemies.filter(e=>!e.dead&&Math.hypot(e.x-t.x,e.y-t.y)<range+60).sort((a,b)=>(b.segment+b.progress)-(a.segment+a.progress))[0];if(m.target&&!m.target.dead){const dx=m.target.x-m.x,dy=m.target.y-m.y,d=Math.hypot(dx,dy);if(d>17){m.x+=dx/d*105*dt;m.y+=dy/d*105*dt}else if(m.cool<=0){m.target.hp-=s.damage*(t.links.includes('might')?1.45:1);m.cool=.55;if(m.target.hp<=0)defeat(m.target)}}}if(t.minions.length<3&&t.cool<=0){const target=enemies.filter(e=>!e.dead&&Math.hypot(e.x-t.x,e.y-t.y)<range).sort((a,b)=>(b.segment+b.progress)-(a.segment+a.progress))[0];if(target){t.minions.push({x:t.x,y:t.y,target,cool:0});t.cool=1.5}}continue}if(t.cool<=0){const target=enemies.filter(e=>!e.dead&&Math.hypot(e.x-t.x,e.y-t.y)<range).sort((a,b)=>(b.segment+b.progress)-(a.segment+a.progress))[0];if(target)fire(t,target)}}
for(const p of projectiles){if(p.dead)continue;if(!p.target||p.target.dead){p.dead=true;continue}const dx=p.target.x-p.x,dy=p.target.y-p.y,len=Math.hypot(dx,dy),step=p.speed*dt;if(len<=step){const hit=p.target;hit.hp-=p.damage;if(p.slow)hit.slow=Math.max(hit.slow,p.slow);if(p.burn)hit.burn=Math.max(hit.burn,p.burn);if(p.splash)for(const e of enemies)if(!e.dead&&e!==hit&&Math.hypot(e.x-hit.x,e.y-hit.y)<p.splash)e.hp-=p.damage*.6;p.dead=true;particles.push({x:hit.x,y:hit.y,vx:0,vy:0,life:.24,color:p.color,ring:true});if(hit.hp<=0)defeat(hit);if(p.splash)for(const e of enemies)if(!e.dead&&e.hp<=0)defeat(e)}else{p.x+=dx/len*step;p.y+=dy/len*step}}
projectiles=projectiles.filter(p=>!p.dead);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const a of arcs)a.life-=dt;arcs=arcs.filter(a=>a.life>0);enemies=enemies.filter(e=>!e.dead||e.hp<=0);document.getElementById('progress').style.width=active?`${100*(waveTotal()-spawnLeft)/waveTotal()}%`:'0%'}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#151d22';ctx.fillRect(0,0,W,H);for(let y=0;y<11;y++)for(let x=0;x<20;x++){ctx.fillStyle=(x+y)%2?'#1a2429':'#1c272c';ctx.fillRect(x*C,y*C,C,C);ctx.strokeStyle='#253138';ctx.strokeRect(x*C,y*C,C,C)}ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();route.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.strokeStyle='#553e2d';ctx.lineWidth=43;ctx.stroke();ctx.strokeStyle='#806041';ctx.lineWidth=34;ctx.stroke();ctx.setLineDash([9,13]);ctx.strokeStyle='#e2ba6c88';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#172735';ctx.beginPath();ctx.arc(906,312,29,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#72d9df';ctx.stroke();ctx.fillStyle='#b9ffff';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText('✧',906,320);
for(const t of towers){const s=skills[t.type],range=s.range*(t.links.includes('reach')?1.25:1);ctx.beginPath();ctx.arc(t.x,t.y,range,0,Math.PI*2);ctx.fillStyle=s.color+'0c';ctx.fill();ctx.strokeStyle=s.color+'22';ctx.stroke();ctx.beginPath();ctx.arc(t.x,t.y,20,0,Math.PI*2);ctx.fillStyle='#18232a';ctx.fill();ctx.strokeStyle=t===selectedTower?'#fff':t.flash>0?'#fff':s.color;ctx.lineWidth=t===selectedTower?4:2;ctx.stroke();ctx.fillStyle=s.color;ctx.font='20px sans-serif';ctx.fillText(s.icon,t.x,t.y+7);t.links.forEach((id,i)=>{ctx.beginPath();ctx.arc(t.x-10+i*20,t.y+25,6,0,Math.PI*2);ctx.fillStyle='#14232b';ctx.fill();ctx.strokeStyle='#73d8df';ctx.stroke();ctx.fillStyle='#a7f3ef';ctx.font='9px sans-serif';ctx.fillText(supports[id].icon,t.x-10+i*20,t.y+28)});for(const m of t.minions){ctx.beginPath();ctx.arc(m.x,m.y,8,0,Math.PI*2);ctx.fillStyle='#ffe27a';ctx.fill();ctx.strokeStyle='#fff4bf';ctx.stroke();ctx.fillStyle='#473a1b';ctx.font='10px sans-serif';ctx.fillText('⚔',m.x,m.y+4)}}
for(const e of enemies){if(e.dead)continue;ctx.beginPath();ctx.arc(e.x,e.y,12,0,Math.PI*2);ctx.fillStyle=e.burn>0?'#ff8b57':e.slow>0?'#91e8eb':'#d7825b';ctx.fill();ctx.strokeStyle='#ffd2aa';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#481f20';ctx.fillRect(e.x-13,e.y-20,26,4);ctx.fillStyle='#ed6b64';ctx.fillRect(e.x-13,e.y-20,26*Math.max(0,e.hp/e.maxHp),4)}for(const p of projectiles){ctx.beginPath();ctx.arc(p.x,p.y,p.lane?6:(p.kind==='splash'?5:4),0,Math.PI*2);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=p.lane?15:9;ctx.fill();ctx.shadowBlur=0}
// Jagged, branching, short-lived electric bolts (not straight laser beams).
for(const a of arcs){const alpha=Math.min(1,a.life/a.maxLife);ctx.globalAlpha=alpha;ctx.shadowColor='#ad75ff';ctx.shadowBlur=18;ctx.strokeStyle='#a96cff';ctx.lineWidth=7;ctx.beginPath();a.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.strokeStyle='#f2eaff';ctx.lineWidth=2.5;ctx.stroke();for(const branch of a.branches){ctx.beginPath();ctx.moveTo(branch[0].x,branch[0].y);ctx.lineTo(branch[1].x,branch[1].y);ctx.strokeStyle='#e7d4ff';ctx.lineWidth=2;ctx.stroke()}ctx.shadowBlur=0;ctx.globalAlpha=1}
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.ring?5:3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}if(gameOver){ctx.fillStyle='#090c11bb';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f0c77a';ctx.font='bold 34px sans-serif';ctx.fillText('灯塔陷落',W/2,H/2)}}
document.getElementById('waveBtn').onclick=()=>{if(gameOver){gold=120;life=20;wave=0;kills=0;towers=[];enemies=[];projectiles=[];particles=[];arcs=[];active=false;gameOver=false;selectedTower=null;updateUI();updateSelection();notify('新的远征开始！');return}if(active)return;wave++;spawnLeft=7+wave*3;spawnTimer=0;active=true;document.getElementById('waveBtn').textContent=`⚔ 第 ${wave} 波进行中`;updateUI()};document.getElementById('speedBtn').onclick=e=>{speed=speed===1?2:1;e.currentTarget.textContent=`⏩ ${speed}×`};window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!active&&!gameOver)document.getElementById('waveBtn').click()}});function frame(time){const dt=(time-last)/1000||0;last=time;update(dt);draw();if(active)updateUI();if(!gameOver&&!active&&wave>0)document.getElementById('waveBtn').textContent=`▶ 开始第 ${wave+1} 波`;requestAnimationFrame(frame)}updateUI();updateSelection();requestAnimationFrame(frame);
})();
